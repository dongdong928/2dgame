<!doctype html><html><head><meta charset=utf8><meta name=viewport content="width=device-width,initial-scale=1,viewport-fit=cover"><style>:root{color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}html{scroll-padding-top:env(safe-area-inset-top,0px)}body{margin:0;padding:0;font:14px -apple-system,BlinkMacSystemFont,sans-serif;background:#fff;color:#000}img{max-width:100%}[hidden]:not([hidden=until-found i]){display:none!important}</style></head><body>
<title>별빛 정거장</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Chakra+Petch:wght@500;700&family=IBM+Plex+Sans+KR:wght@400;500;700&display=swap">
<style>
/* Layout: a station deck (canvas) on the left, a tabbed control console on the right; resources run across the top like a flight instrument strip. Single dark world by choice. */
:root{
  --bg:#060919; --bg2:#0b1130; --panel:#101839; --panel2:#16214a; --line:#26356b;
  --fg:#e4e9ff; --muted:#8e9acb;
  --credit:#ffc65a; --energy:#5cd6ff; --ore:#ff8f63; --rp:#b99cff; --good:#6fe3a1; --bad:#ff6b7d;
  --accent:#ffc65a;
  --display:'Chakra Petch','IBM Plex Sans KR',system-ui,sans-serif;
  --body:'IBM Plex Sans KR',system-ui,-apple-system,'Apple SD Gothic Neo','Malgun Gothic',sans-serif;
  color-scheme:dark;
}
*{box-sizing:border-box}
body{background:var(--bg);color:var(--fg);font-family:var(--body);font-size:14px;line-height:1.5;
  padding-block:12px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
button{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.app{max-width:1280px;margin:0 auto;display:flex;flex-direction:column;gap:12px}
.top{display:flex;flex-wrap:wrap;gap:10px 16px;align-items:center;justify-content:space-between;padding:10px 14px;background:linear-gradient(180deg,var(--panel),var(--bg2));border:1px solid var(--line);border-radius:14px}
.brand{display:flex;gap:10px;align-items:center;min-width:0}
.brand svg{width:34px;height:34px;flex:none}
.brand b{font-family:var(--display);font-size:18px;letter-spacing:.03em;display:block;line-height:1.2}
.brand small{display:block;color:var(--muted);font-size:11px;letter-spacing:.08em}
.res{display:flex;flex-wrap:wrap;gap:8px;flex:1;justify-content:center;min-width:0}
.chip{display:flex;align-items:center;gap:8px;padding:5px 10px;background:rgba(255,255,255,.04);border:1px solid var(--line);border-radius:10px;min-width:0}
.chip svg{width:18px;height:18px;flex:none}
.chip .v{font-family:var(--display);font-weight:700;font-size:16px;font-variant-numeric:tabular-nums;line-height:1.2}
.chip .r{font-size:11px;color:var(--muted);font-variant-numeric:tabular-nums;line-height:1.2;white-space:nowrap}
.chip.bad{border-color:var(--bad)}
.chip.bad .r{color:var(--bad)}
.ctl{display:flex;gap:4px}
.ctl button{background:var(--panel2);border:1px solid var(--line);padding:6px 10px;border-radius:8px;cursor:pointer;font-family:var(--display);font-weight:700;font-size:13px;min-width:44px}
.ctl button[aria-pressed="true"]{background:var(--accent);color:#2a1a00;border-color:var(--accent)}
.main{display:grid;grid-template-columns:minmax(0,1fr) 400px;gap:12px;align-items:start}
.stage{position:relative;border:1px solid var(--line);border-radius:14px;overflow:hidden;background:#04061a;min-width:0}
#cv{display:block;width:100%;height:auto;aspect-ratio:960/640;touch-action:manipulation;cursor:crosshair}
.obj{position:absolute;left:10px;top:10px;max-width:min(72%,380px);background:rgba(8,12,34,.8);border:1px solid var(--line);border-left:3px solid var(--accent);padding:6px 12px;border-radius:8px;pointer-events:none}
.obj small{display:block;color:var(--muted);font-size:10.5px;letter-spacing:.12em}
.obj span{font-size:13px}
.hintbar{position:absolute;left:10px;right:10px;bottom:8px;background:rgba(8,12,34,.8);border:1px solid var(--line);border-radius:8px;padding:5px 12px;font-size:12.5px;color:var(--muted);pointer-events:none;min-height:30px}
.side{display:flex;flex-direction:column;background:var(--panel);border:1px solid var(--line);border-radius:14px;min-width:0;overflow:hidden}
.tabs{display:flex;border-bottom:1px solid var(--line);overflow-x:auto;flex:none}
.tabs button{flex:1;background:none;border:0;border-bottom:2px solid transparent;padding:11px 8px;cursor:pointer;color:var(--muted);font-weight:500;white-space:nowrap;position:relative}
.tabs button[aria-selected="true"]{color:var(--fg);border-bottom-color:var(--accent);background:rgba(255,198,90,.06)}
.tabs button .dot{position:absolute;top:7px;right:6px;width:7px;height:7px;border-radius:50%;background:var(--bad)}
#panel{padding:12px;overflow-y:auto;flex:1;min-height:0;display:flex;flex-direction:column;gap:10px}
.note{margin:0;color:var(--muted);font-size:12.5px}
.note b{color:var(--fg)}
.cards{display:grid;grid-template-columns:1fr;gap:8px}
.card{display:flex;gap:10px;align-items:center;text-align:left;padding:8px 10px;background:var(--panel2);border:1px solid var(--line);border-radius:10px;cursor:pointer;width:100%}
.card canvas{width:52px;height:52px;flex:none;background:#0a1030;border-radius:8px}
.card .ct{display:flex;flex-direction:column;min-width:0;gap:1px}
.card small{color:var(--muted);font-size:12px;line-height:1.35}
.card em{font-style:normal;font-family:var(--display);font-size:12.5px;color:var(--credit);font-variant-numeric:tabular-nums}
.card.sel{border-color:var(--accent);box-shadow:inset 0 0 0 1px var(--accent)}
.card.poor em{color:var(--bad)}
.card.lock{opacity:.5;cursor:not-allowed}
.btn{background:var(--panel2);border:1px solid var(--line);padding:7px 12px;border-radius:8px;cursor:pointer;font-weight:500}
.btn.pri{background:var(--accent);border-color:var(--accent);color:#2a1a00;font-weight:700}
.btn:disabled{opacity:.45;cursor:not-allowed}
.row{display:flex;flex-wrap:wrap;gap:6px}
.selbox{background:var(--panel2);border:1px solid var(--accent);border-radius:10px;padding:10px;display:flex;flex-direction:column;gap:8px}
.selh{display:flex;gap:10px;align-items:center}
.selh canvas{width:52px;height:52px;background:#0a1030;border-radius:8px;flex:none}
.selh small{display:block;color:var(--muted);font-size:12px}
.lv{font-family:var(--display);color:var(--accent);font-size:12px;margin-left:4px}
.tcard,.dcard,.nc,.ach{display:flex;gap:10px;align-items:center;justify-content:space-between;padding:9px 10px;background:var(--panel2);border:1px solid var(--line);border-radius:10px}
.tcard .tt,.dcard .tt{display:flex;flex-direction:column;min-width:0;gap:1px}
.tcard small,.dcard small{color:var(--muted);font-size:12px;line-height:1.35}
.tcard.done{opacity:.6}
.tcard.locked{opacity:.5}
.h{margin:4px 0 0;font-family:var(--display);font-size:12px;letter-spacing:.12em;color:var(--muted);text-transform:uppercase}
.bar{height:6px;border-radius:4px;background:#0a1030;overflow:hidden}
.bar i{display:block;height:100%;background:linear-gradient(90deg,var(--energy),var(--rp));width:0}
.run{padding:8px 10px;background:var(--panel2);border:1px solid var(--line);border-radius:10px;display:flex;flex-direction:column;gap:5px;font-size:12.5px}
.run div{display:flex;justify-content:space-between;gap:8px}
.slots{display:grid;grid-template-columns:1fr 1fr;gap:6px}
.slot{padding:7px 9px;border:1px dashed var(--line);border-radius:8px;display:flex;flex-direction:column;gap:1px;min-width:0;color:var(--muted)}
.slot.on{border:1px solid var(--rc);color:var(--fg);background:rgba(255,255,255,.03)}
.slot b{font-size:12.5px}
.slot small{color:var(--rc);font-size:11px}
.slot i{font-style:normal;font-size:11.5px;color:var(--muted);line-height:1.35}
.stock{display:flex;align-items:center;justify-content:space-between;gap:8px;padding:7px 10px;background:var(--panel2);border:1px solid var(--line);border-radius:10px;font-size:13px}
.nc{flex-direction:column;align-items:stretch}
.nc .top2{display:flex;gap:10px;align-items:center}
.av{width:52px;height:52px;border-radius:10px;overflow:hidden;flex:none;background:#0a1030}
.av svg{width:100%;height:100%;display:block}
.nc .nb{flex:1;min-width:0}
.nc .nb small{display:block;color:var(--muted);font-size:12px}
.hearts{letter-spacing:2px;color:var(--accent);font-size:12px}
.q{padding:8px 10px;background:rgba(0,0,0,.2);border-radius:8px;display:flex;flex-direction:column;gap:5px;font-size:12.5px}
.q small{color:var(--muted)}
.ach{padding:7px 10px;justify-content:flex-start}
.ach.off{opacity:.5}
.ach b{font-size:13px}
.ach small{color:var(--muted);display:block;font-size:11.5px}
.ach .ok{color:var(--accent);font-family:var(--display);width:18px;flex:none}
.stats{display:grid;grid-template-columns:1fr 1fr;gap:6px}
.stats div{padding:7px 10px;background:var(--panel2);border:1px solid var(--line);border-radius:8px;font-size:12px;color:var(--muted)}
.stats b{display:block;color:var(--fg);font-family:var(--display);font-size:15px;font-variant-numeric:tabular-nums}
#modal{position:fixed;inset:0;z-index:60;display:flex;align-items:flex-end;justify-content:center;background:rgba(3,5,18,.72);padding:max(16px,env(safe-area-inset-top,0px)) max(16px,env(safe-area-inset-right,0px)) max(16px,env(safe-area-inset-bottom,0px)) max(16px,env(safe-area-inset-left,0px))}
#m-card{width:min(640px,100%);background:linear-gradient(180deg,var(--panel2),var(--panel));border:1px solid var(--line);border-top:3px solid var(--accent);border-radius:14px;padding:16px;display:flex;flex-direction:column;gap:12px;box-shadow:0 20px 60px rgba(0,0,0,.5)}
#m-title{font-family:var(--display);font-size:12px;letter-spacing:.14em;color:var(--accent);text-transform:uppercase;min-height:1em}
.m-who{display:flex;gap:12px;align-items:center}
.m-who .av{width:64px;height:64px;border-radius:12px}
.m-who b{display:block;font-size:16px}
.m-who small{color:var(--muted)}
#m-text{min-height:5.2em;font-size:15px;line-height:1.7}
#m-act{display:flex;flex-wrap:wrap;gap:8px;justify-content:flex-end;min-height:38px}
.toasts{position:fixed;left:0;right:0;bottom:calc(14px + env(safe-area-inset-bottom,0px));display:flex;flex-direction:column;align-items:center;gap:6px;padding-inline:max(16px,env(safe-area-inset-left,0px)) max(16px,env(safe-area-inset-right,0px));pointer-events:none;z-index:50}
.toast{background:rgba(14,20,52,.96);border:1px solid var(--line);border-left:3px solid var(--energy);padding:8px 14px;border-radius:8px;font-size:13px;max-width:100%;transition:opacity .4s,transform .4s}
.toast.gold{border-left-color:var(--accent)}
.toast.bad{border-left-color:var(--bad)}
.toast.out{opacity:0;transform:translateY(6px)}

/* ---- v2: 자원 구분, 연구 시간, 시장 ---- */
[hidden]{display:none!important}
.tabs button{padding:11px 6px}
.chip{position:relative;padding:5px 12px 8px 10px}
.chip .lb{display:block;font-size:10.5px;letter-spacing:.08em;color:var(--muted);line-height:1.1}
.chip.c-credits{background:linear-gradient(180deg,rgba(255,198,90,.18),rgba(255,198,90,.04));border-color:rgba(255,198,90,.55)}
.chip.c-credits .v{color:var(--credit)}
.chip.c-ore{background:linear-gradient(180deg,rgba(255,143,99,.18),rgba(255,143,99,.04));border-color:rgba(255,143,99,.55)}
.chip.c-ore .v{color:var(--ore)}
.chip.c-rp{background:linear-gradient(180deg,rgba(185,156,255,.16),rgba(185,156,255,.04));border-color:rgba(185,156,255,.5)}
.chip.c-rp .v{color:var(--rp)}
.chip.c-energy .v{color:var(--energy)}
.chip.c-crew .v{color:#ffe29a}
.chip .cap{position:absolute;left:8px;right:8px;bottom:3px;height:3px;border-radius:2px;background:rgba(0,0,0,.4);overflow:hidden}
.chip .cap i{display:block;height:100%;background:var(--ore);width:0;transition:width .3s}
.chip .cap.full i{background:var(--bad)}
.chip.bad{border-color:var(--bad)!important}
.ic{display:inline-block;width:13px;height:13px;vertical-align:-2px;margin-right:3px}
.ic svg{width:100%;height:100%;display:block}
.cr{color:var(--credit);white-space:nowrap}
.or{color:var(--ore);white-space:nowrap}
.cr.lack,.or.lack{color:var(--bad)}
.card em{color:var(--fg)}
.rstrip{position:absolute;right:10px;top:10px;display:flex;flex-direction:column;gap:6px;width:min(250px,44%);pointer-events:none}
.rs{background:rgba(8,12,34,.84);border:1px solid var(--line);border-left:3px solid var(--rp);border-radius:8px;padding:5px 10px;font-size:12px}
.rs>div:first-child{display:flex;justify-content:space-between;gap:8px}
.rs b{font-weight:500;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;min-width:0}
.rs span{font-family:var(--display);font-variant-numeric:tabular-nums;color:var(--rp);white-space:nowrap}
.rs .bar{margin-top:4px}
.run>div:first-child span{font-family:var(--display);font-variant-numeric:tabular-nums;color:var(--rp)}
.tcard small.tm{color:var(--rp)}
.price{display:flex;align-items:flex-end;justify-content:space-between;gap:10px;padding:10px;background:var(--panel2);border:1px solid var(--line);border-radius:10px}
.price .big{font-family:var(--display);font-size:28px;font-weight:700;color:var(--ore);line-height:1.1}
.price small{color:var(--muted);display:block}
.price svg{width:140px;height:44px;flex:none}
.up{color:var(--good)!important}
.dn{color:var(--bad)!important}
.bar.ct i{background:linear-gradient(90deg,var(--credit),var(--ore))}
@media (max-width:720px){
  .top{flex-direction:column;align-items:stretch}
  .res{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));justify-content:stretch}
  .chip .r{white-space:normal}
  .ctl{justify-content:space-between}.ctl button{flex:1}
  .obj,.rstrip,.hintbar{position:static;max-width:none;width:auto;margin:8px 10px 0}
  .hintbar{margin-bottom:8px}
  .rstrip:empty{display:none}
}
#mini{position:fixed;inset:0;z-index:70;display:flex;align-items:center;justify-content:center;background:rgba(3,5,18,.8);padding:max(16px,env(safe-area-inset-top,0px)) max(16px,env(safe-area-inset-right,0px)) max(16px,env(safe-area-inset-bottom,0px)) max(16px,env(safe-area-inset-left,0px))}
.mcard{width:min(420px,100%);background:linear-gradient(180deg,var(--panel2),var(--panel));border:1px solid var(--line);border-top:3px solid var(--rp);border-radius:14px;padding:16px;display:flex;flex-direction:column;gap:12px;box-shadow:0 20px 60px rgba(0,0,0,.5)}
.mt{font-family:var(--display);font-size:12px;letter-spacing:.14em;color:var(--rp);text-transform:uppercase}
.ms{min-height:2.8em;font-size:14px}
.ms2{min-height:1.4em;font-size:13px;color:var(--rp);font-family:var(--display)}
.pads{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}
.pad{height:88px;border-radius:14px;border:2px solid var(--pc);background:rgba(255,255,255,.04);font-size:32px;color:var(--pc);cursor:pointer;transition:background .08s,box-shadow .08s}
.pad.on{background:var(--pc);color:#08102a;box-shadow:0 0 28px var(--pc)}
#snd{min-width:76px}
.dcard .btn,.tcard .btn{white-space:nowrap;flex:none}
@media (max-width:960px){.main{grid-template-columns:minmax(0,1fr)}.res{justify-content:flex-start}}
@media (max-width:520px){.slots{grid-template-columns:1fr}.chip{padding:4px 8px}.chip .v{font-size:14px}.stats{grid-template-columns:1fr}}
@media (prefers-reduced-motion:reduce){.toast{transition:none}}
</style>

<div class="app">
  <header class="top">
    <div class="brand">
      <svg viewBox="0 0 34 34" aria-hidden="true"><circle cx="17" cy="17" r="15" fill="#0d1a44" stroke="#26356b"/><circle cx="17" cy="17" r="6" fill="#ffc65a"/><ellipse cx="17" cy="17" rx="14" ry="5" fill="none" stroke="#5cd6ff" stroke-width="1.5" transform="rotate(-25 17 17)"/></svg>
      <div><b>별빛 정거장</b><small>STARLIGHT STATION · <span id="day">1</span>일째</small></div>
    </div>
    <div class="res" id="res"></div>
    <div class="ctl" id="ctl" role="group" aria-label="게임 속도">
      <button data-speed="0" aria-pressed="false">정지</button>
      <button data-speed="1" aria-pressed="true">1x</button>
      <button data-speed="2" aria-pressed="false">2x</button>
      <button data-speed="4" aria-pressed="false">4x</button>
      <button id="snd" aria-pressed="true" title="소리 켜기/끄기">소리 켬</button>
    </div>
  </header>
  <div class="main">
    <section class="stage">
      <canvas id="cv" aria-label="정거장 지도"></canvas>
      <div class="obj"><small>현재 목표</small><span id="obj"></span></div>
      <div class="rstrip" id="rstrip"></div>
      <div class="hintbar" id="hint"></div>
    </section>
    <aside class="side">
      <div class="tabs" id="tabs" role="tablist">
        <button data-tab="build" role="tab" aria-selected="true">건설</button>
        <button data-tab="tech" role="tab" aria-selected="false">연구</button>
        <button data-tab="market" role="tab" aria-selected="false">시장<i class="dot" id="mktdot" hidden></i></button>
        <button data-tab="exp" role="tab" aria-selected="false">탐사</button>
        <button data-tab="npc" role="tab" aria-selected="false">인물<i class="dot" id="npcdot" hidden></i></button>
        <button data-tab="log" role="tab" aria-selected="false">기록<i class="dot" id="logdot" hidden></i></button>
      </div>
      <div id="panel"></div>
    </aside>
  </div>
</div>
<div id="mini" hidden role="dialog" aria-modal="true" aria-label="신호 해독">
  <div class="mcard"><div class="mt">신호 해독</div><div class="ms" id="mini-s"></div><div class="pads" id="pads"></div><div class="ms2" id="mini-g"></div><div class="row"><button class="btn" id="mini-x">닫기</button></div></div>
</div>
<div class="toasts" id="toasts" aria-live="polite"></div>
<div id="modal" hidden role="dialog" aria-modal="true" aria-labelledby="m-name">
  <div id="m-card">
    <div id="m-title"></div>
    <div class="m-who"><div class="av" id="m-av"></div><div><b id="m-name"></b><small id="m-role"></small></div></div>
    <div id="m-text"></div>
    <div id="m-act"></div>
  </div>
</div>

<script>
(()=>{

const KEY='byeolbit-station-v1';

const rnd=(a,b)=>a+Math.random()*(b-a);
const ri=(a,b)=>Math.floor(rnd(a,b+1));
const pick=a=>a[Math.floor(Math.random()*a.length)];
const f=n=>Math.floor(n).toLocaleString('ko-KR');
const clamp=(v,a,b)=>Math.max(a,Math.min(b,v));

/* ====================== 데이터 ====================== */
const DEF={
  hq:{n:'중앙 본부',d:'정거장의 중심. 승무원 4명과 전력 4를 제공합니다.',cost:0,ore:0},
  solar:{n:'태양광 패널',d:'햇빛으로 전력을 만듭니다.',cost:60,ore:0,pw:5},
  habitat:{n:'거주 모듈',d:'승무원 4명이 머뭅니다. 승무원은 세금을 냅니다.',cost:120,ore:0,use:1},
  miner:{n:'광물 채굴기',d:'소행성 광물을 캡니다. 승무원 1명 필요.',cost:100,ore:0,use:2,staff:1},
  depot:{n:'광물 창고',d:'광물 보관 한도 +300. 한도가 차면 채굴이 멈춥니다.',cost:150,ore:0,use:1},

function recalc(){
  const cnt={};let supply=0,demand=0,staff=0,crew=4+(S.bonusCrew||0),capOre=200,labPow=0;
  const mulSolar=has('solar2')?1.3:1;
  for(const k of S.grid){
    if(!k)continue;const d=DEF[k.t],lm=L(k.lvl);cnt[k.t]=(cnt[k.t]||0)+1;
    if(k.t==='hq')supply+=4;
    if(d.pw)supply+=d.pw*lm*(k.t==='solar'?mulSolar:1);
    if(d.use)demand+=d.use*(1+.3*(k.lvl-1));
    if(d.staff)staff+=1;
    if(k.t==='habitat')crew+=4*lm;
    if(k.t==='depot')capOre+=300*lm;
    if(k.t==='lab')labPow+=lm;
  }
  capOre=Math.round(capOre);
  staff*=has('ai')?.65:1;
  if(S.buffs.flare>0)supply*=.5;
  const effE=demand>0?Math.min(1,supply/demand):1;
  const effS=staff>0?Math.min(1,crew/staff):1;
  const eff=Math.min(effE,effS);
  const morale=1+Math.min(.3,.06*(cnt.cafe||0)+.04*(cnt.garden||0))+(S.buffs.party>0?.25:0);
  const mulOre=1+(has('mining')?.25:0);
  const mulRef=(1+(has('refine1')?.25:0))*(S.buffs.tinker>0?1.25:1);
  const mulRP=1+(has('quantum')?.3:0)+(has('ai')?.15:0);
  let ore=0,cap=0,rp=0;
  for(const k of S.grid){
    if(!k)continue;const lm=L(k.lvl);
    if(k.t==='miner')ore+=.8*lm;
    if(k.t==='refinery')cap+=3*lm;
    if(k.t==='lab')rp+=1.5*lm;
    if(k.t==='observatory')rp+=1.0*lm;
  }
  ore*=eff*morale*mulOre;cap*=eff*morale;rp*=eff*morale*mulRP;
  const tax=crew*.4*morale;
  const full=S.ore>=capOre,oreIn=full?0:ore;
  const conv=Math.min(cap,S.ore+oreIn),price=S.market.p;
  const rs=labPow>0?Math.max(.2,eff)*(1+.12*(labPow-1)):0;
  C={cnt,supply,demand,staff,crew,effE,effS,eff,morale,ore:oreIn,oreRaw:ore,oreIn,full,capOre,cap,conv,price,rs,rp,tax,mulRef,crate:tax+conv*price*mulRef};
}

function place(idx,t){
  if(S.grid[idx])return;
  if(!unlocked(t)){toast('아직 연구하지 않은 시설입니다.','bad');return;}
  if(DEF[t].max&&count(t)>=DEF[t].max){toast('이미 지었습니다.','bad');placing=null;return;}
  const c=costOf(t);
  if(!pay(c)){toast('자원이 부족합니다. '+costText(c)+' 필요','bad');return;}
  S.grid[idx]={t,lvl:1};S.stats.built++;born[idx]=anim;sfx('build');
  const p=tc(idx);burst(p.x,p.y,'#ffc65a',14);
  recalc();updateTop();checkAch();
  if(DEF[t].max)placing=null;
}
function upgrade(){
  const k=S.grid[S.sel];if(!k||k.lvl>=3)return;
  const c=upCost(k);if(!pay(c)){toast('자원이 부족합니다.','bad');return;}
  k.lvl++;sfx('up');const p=tc(S.sel);burst(p.x,p.y,'#5cd6ff',16);toast(DEF[k.t].n+' Lv '+k.lvl);recalc();updateTop();
}
function demolish(){
  const k=S.grid[S.sel];if(!k||k.t==='hq'||k.t==='gate')return;
  if(demArm!==S.sel){demArm=S.sel;refreshPanel(true);return;}
  addCr(0);S.credits+=Math.floor(DEF[k.t].cost*.5);
  const p=tc(S.sel);burst(p.x,p.y,'#ff6b7d',12);
  S.grid[S.sel]=null;S.sel=null;demArm=-1;recalc();updateTop();
}
function statText(k){
  const lm=L(k.lvl),d=DEF[k.t],p=[];

  if(d.pw)p.push('전력 +'+(d.pw*lm*(k.t==='solar'&&has('solar2')?1.3:1)).toFixed(1));
  if(d.use)p.push('전력 −'+(d.use*(1+.3*(k.lvl-1))).toFixed(1));

  if(k.t==='refinery')p.push('광물 '+(3*lm).toFixed(1)+'/초 처리');
  if(k.t==='lab')p.push('연구 '+(1.5*lm).toFixed(1)+'/초');

function rollArt(w){
  const x=Math.random()*(w[0]+w[1]+w[2]);
  const r=x<w[0]?0:(x<w[0]+w[1]?1:2);
  const pool=ART.filter(a=>a.r===r),fresh=pool.filter(a=>!S.found[a.id]);
  const a=(fresh.length&&Math.random()<.8)?pick(fresh):pick(pool);
  S.found[a.id]=true;S.stock[a.id]=(S.stock[a.id]||0)+1;return a;
}
function giveReward(r){
  const p=[];
  if(r.credits){addCr(r.credits);p.push('크레딧 '+f(r.credits));}
  if(r.ore){S.ore+=r.ore;p.push('광물 '+f(r.ore));}
  if(r.rp){addRP(r.rp);p.push('연구 '+f(r.rp));}
  if(r.art){const a=rollArt(r.art===2?[0,0,1]:[0,1,0]);p.push('유물 '+a.n);}
  return p.join(', ');
}
function analyze(id){
  const a=ART.find(x=>x.id===id);if(!a||!(S.stock[id]>0))return;
  if(!count('lab')){toast('연구소가 필요합니다.','bad');return;}
  if(a.r===2&&!count('analyzer')){toast('전설 유물은 유물 분석실이 있어야 분석할 수 있어요.','bad');return;}
  S.stock[id]--;if(S.stock[id]<=0)delete S.stock[id];
  const gain=Math.round(a.rp*(1+.5*Math.min(2,count('analyzer'))));
  addRP(gain);
  if(!S.analyzed[id]){S.analyzed[id]=true;showDialog({title:'유물 분석 완료',lines:[{who:'sys',t:a.n+' ('+RAR[a.r]+') 분석 완료. 연구 점수 +'+gain},{who:S.unlocked.elara?'elara':'sys',t:a.lore}],choices:[]});}
  else toast(a.n+' 분석 · 연구 +'+gain);
}

function fireEvent(){
  const pool=EV.filter(e=>e.ok());if(!pool.length)return;
  let t=Math.random()*pool.reduce((a,e)=>a+e.w,0),ev=pool[0];
  for(const e of pool){t-=e.w;if(t<=0){ev=e;break;}}
  S.stats.events++;showDialog(ev.mk());
}

const canInterrupt=()=>!modalOpen&&!miniOpen&&!dialogQueue.length;
function startTech(id){
  const x=TECH.find(t=>t.id===id);if(!x||has(id)||S.research.some(e=>e.id===id)||!techOk(x))return;
  if(!count('lab')){toast('연구소가 필요합니다.','bad');return;}
  if(S.research.length>=resSlots()){toast('연구 슬롯이 가득 찼습니다.','bad');return;}
  if(S.rp<x.cost){toast('연구 점수가 부족합니다.','bad');return;}
  S.rp-=x.cost;S.research.push({id,left:x.t,total:x.t});
  toast('연구 시작: '+x.n+' (약 '+fmtT(x.t/Math.max(.2,C.rs||1))+')');updateTop();renderRStrip();
}
function renderRStrip(){
  $('#rstrip').innerHTML=S.research.map(e=>{const x=TECH.find(t=>t.id===e.id);return '<div class="rs"><div><b>연구 · '+x.n+'</b><span data-reta="'+e.id+'"></span></div><div class="bar"><i data-rbar="'+e.id+'"></i></div></div>';}).join('');
  rsig=S.research.map(e=>e.id).join();collectLive();
}
function collectLive(){liveR=[...document.querySelectorAll('[data-rbar],[data-reta],[data-ctbar],[data-ctt]')];}
function updateLive(){
  const run=S.speed>0&&!modalOpen&&!miniOpen,sp=S.speed;
  for(const el of liveR){
    const dsx=el.dataset;
    if(dsx.ctbar||dsx.ctt){
      const c=S.contracts.find(x=>x.id===(dsx.ctbar||dsx.ctt));if(!c)continue;
      if(dsx.ctbar)el.style.width=(c.left/c.total*100).toFixed(1)+'%';
      else el.textContent='남은 시간 '+(run?fmtT(c.left/sp):'일시정지');
      continue;
    }
    const e=S.research.find(r=>r.id===(dsx.rbar||dsx.reta));if(!e)continue;
    const left=Math.max(0,e.left-(run?acc*C.rs:0));
    if(dsx.rbar)el.style.width=((1-left/e.total)*100).toFixed(1)+'%';
    else el.textContent=!C.rs?'연구소 필요':(run?fmtT(left/(C.rs*sp)):'일시정지');
  }
}
function step(){
  S.tick++;recalc();
  S.credits+=C.tax;S.stats.earned+=C.tax;
  if(S.ore<C.capOre)S.ore=Math.min(C.capOre,S.ore+C.oreRaw);
  else if(C.oreRaw>0&&S.tick%30===0)toast('광물 창고가 가득 찼습니다. 시장에서 팔거나 창고를 지으세요.','bad');
  const conv=Math.min(C.cap,S.ore);
  if(conv>0){S.ore-=conv;const g=conv*C.price*C.mulRef;S.credits+=g;S.stats.earned+=g;}
  addRP(C.rp);
  spawnFlows();
  for(let i=S.research.length-1;i>=0;i--){
    const e=S.research[i];e.left-=C.rs;
    if(e.left<=0){
      S.research.splice(i,1);S.techs[e.id]=true;const x=TECH.find(t=>t.id===e.id);
      toast('연구 완료: '+x.n,'gold');
      const lb=tileList('lab')[0];if(lb!=null){const p=tc(lb);floatText(p.x,p.y-30,'연구 완료','#b99cff','rp');burst(p.x,p.y,'#b99cff',20);}
      recalc();checkAch();
    }
  }
  S.cometT--;
  if(S.cometT<=0){S.cometT=Math.round(ri(90,150)*Math.pow(.75,C.cnt.observatory||0));if(S.day>=3)spawnComet();}
  if(S.sigCD>0)S.sigCD--;
  if(!S.unlocked.mio&&count('cafe')>0&&S.tick%2===0&&canInterrupt()){
    S.unlocked.mio=1;
    showDialog({title:'새 얼굴',lines:[{who:'mio',t:'안녕하세요! 카페에서 맛있는 냄새가 난다고 해서 왔어요. 저는 미오, 우주 요리사예요.'},{who:'mio',t:'승무원들이 잘 먹어야 정거장이 잘 돌아가죠. 정원도 가꾸고 싶은데 도와주실래요?'}],choices:[]});
  }
  if(S.tick%4===0)ensureGoals();
  if(S.tick%8===0){const m=S.market;m.p=clamp(m.p+(2.2-m.p)*.12+rnd(-.35,.35),1,3.4);m.h.push(m.p);if(m.h.length>28)m.h.shift();}
  S.ctT--;
  if(S.ctT<=0){
    S.ctT=ri(45,80);
    if(S.contracts.length<2&&S.day>=2){
      const ore=ri(25,60)+Math.floor(S.day*2),reward=Math.round(ore*(2.7+Math.random()*1.1));

const AU={c:null,on:true,master:null,amb:null,last:{}};
try{AU.on=localStorage.getItem('byeolbit-snd')!=='0';}catch(e){}
function audioInit(){
  if(AU.c||!AU.on)return;
  try{
    const Ctx=window.AudioContext||window.webkitAudioContext;if(!Ctx)return;
    AU.c=new Ctx();AU.master=AU.c.createGain();AU.master.gain.value=.5;AU.master.connect(AU.c.destination);
    const c=AU.c,g=c.createGain();g.gain.value=0;g.connect(AU.master);
    const fl=c.createBiquadFilter();fl.type='lowpass';fl.frequency.value=380;fl.connect(g);
    [55,82.5,110.3].forEach((fr,i)=>{const o=c.createOscillator();o.type=i?'sine':'triangle';o.frequency.value=fr;o.connect(fl);o.start();});
    const lfo=c.createOscillator(),lg=c.createGain();lfo.frequency.value=.07;lg.gain.value=120;lfo.connect(lg);lg.connect(fl.frequency);lfo.start();
    g.gain.linearRampToValueAtTime(.05,c.currentTime+4);AU.amb=g;
  }catch(e){AU.c=null;}
}
function tone(freq,dur,type,vol,delay,slide){
  const c=AU.c,t=c.currentTime+(delay||0),o=c.createOscillator(),g=c.createGain();
  o.type=type||'sine';o.frequency.setValueAtTime(freq,t);if(slide)o.frequency.exponentialRampToValueAtTime(slide,t+dur);
  g.gain.setValueAtTime(.0001,t);g.gain.exponentialRampToValueAtTime(vol||.2,t+.01);g.gain.exponentialRampToValueAtTime(.0001,t+dur);
  o.connect(g);g.connect(AU.master);o.start(t);o.stop(t+dur+.02);
}
function noise(dur,vol,fc){
  const c=AU.c,n=Math.floor(c.sampleRate*dur),buf=c.createBuffer(1,n,c.sampleRate),d=buf.getChannelData(0);
  for(let i=0;i<n;i++)d[i]=(Math.random()*2-1)*(1-i/n);
  const s=c.createBufferSource();s.buffer=buf;const fl=c.createBiquadFilter();fl.type='lowpass';fl.frequency.value=fc||600;
  const g=c.createGain();g.gain.value=vol||.3;s.connect(fl);fl.connect(g);g.connect(AU.master);s.start();
}
const SFX={
  coin(){tone(988,.09,'square',.06);tone(1319,.16,'square',.06,.07);},
  tink(){tone(1568,.07,'sine',.04);},
  ore(){tone(180,.14,'triangle',.18,0,110);},
  build(){tone(220,.18,'square',.07,0,440);tone(440,.12,'triangle',.1,.16);},
  up(){tone(392,.1,'triangle',.12);tone(523,.1,'triangle',.12,.09);tone(784,.2,'triangle',.12,.18);},
  chime(){tone(784,.14,'sine',.12);tone(1175,.3,'sine',.1,.1);},
  alert(){tone(220,.18,'sawtooth',.06);tone(180,.22,'sawtooth',.06,.16);},
  boom(){noise(.45,.35,500);tone(70,.4,'sine',.25,0,35);},
  pad(i){tone([392,330,494,262][i]||392,.25,'sine',.2);},
  bad(){tone(120,.4,'sawtooth',.12,0,70);}
};
function sfx(k,a){
  if(!AU.on||!AU.c||!SFX[k])return;
  const now=performance.now();if(now-(AU.last[k]||0)<(k==='tink'?400:70))return;AU.last[k]=now;
  try{SFX[k](a);}catch(e){}
}
function setSound(on){
  AU.on=on;try{localStorage.setItem('byeolbit-snd',on?'1':'0');}catch(e){}
  if(on){audioInit();if(AU.c&&AU.c.state==='suspended')AU.c.resume();if(AU.amb)AU.amb.gain.linearRampToValueAtTime(.05,AU.c.currentTime+1);}
  else if(AU.amb)AU.amb.gain.linearRampToValueAtTime(0,AU.c.currentTime+.4);
  const b=$('#snd');if(b){b.setAttribute('aria-pressed',on?'true':'false');b.textContent=on?'소리 켬':'소리 끔';}
}

function updateWorld(dt){
  if(shake>0)shake=Math.max(0,shake-dt*1.5);
  vaultP=Math.max(0,vaultP-dt*2);
  for(let i=fx.length-1;i>=0;i--){const p=fx[i];p.life-=dt;p.x+=p.vx*dt;p.y+=p.vy*dt;if(p.life<=0)fx.splice(i,1);}
  for(let i=beams.length-1;i>=0;i--){beams[i].life-=dt;if(beams[i].life<=0)beams.splice(i,1);}
  if(!running)return;
  const d2=dt*S.speed;
  for(let i=ships.length-1;i>=0;i--){ships[i].a+=d2;if(ships[i].a>5.6)ships.splice(i,1);}
  for(let i=caps.length-1;i>=0;i--){const c=caps[i];c.x+=c.vx*d2;c.y+=c.vy*d2;c.age+=d2;if(c.age>16||c.x<-60||c.x>W+60||c.y<-60||c.y>H+60)caps.splice(i,1);}
  for(let i=flows.length-1;i>=0;i--){
    const f=flows[i];f.p+=d2*f.sp;
    if(f.p>=1){if(f.kind==='coin'){vaultP=1;burst(f.bx,f.by,'#ffc65a',4);sfx('tink');}else burst(f.bx,f.by,'#ff8f63',3);flows.splice(i,1);}
  }
  for(let i=comets.length-1;i>=0;i--){const m=comets[i];m.x+=m.vx*d2;m.y+=m.vy*d2;m.age+=d2;if(m.x<-180||m.x>W+180||m.y>H+100||m.age>40)comets.splice(i,1);}
  const want=Math.min(12,Math.floor(C.crew||0));
  while(walkers.length<want)walkers.push(newWalker());
  while(walkers.length>want)walkers.pop();
  for(const w of walkers){
    if(w.mv){
      const dx=w.tx-w.x,dy=w.ty-w.y,dd=Math.hypot(dx,dy),st=26*d2;
      if(dd<=st){w.x=w.tx;w.y=w.ty;w.mv=false;w.wait=rnd(1,4);}else{w.x+=dx/dd*st;w.y+=dy/dd*st;if(Math.abs(dx)>2)w.dir=dx>0?1:-1;}
    }else{w.wait-=d2;if(w.wait<=0){const p=tc(pick(occTiles()));w.tx=p.x+rnd(-20,20);w.ty=p.y+rnd(-18,18);w.mv=true;}}
  }
  updateDrones(d2);
  for(let i=rocks.length-1;i>=0;i--){
    const r=rocks[i];if(r.d>0){r.d-=d2;continue;}
    const dx=r.tx-r.x,dy=r.ty-r.y,dd=Math.hypot(dx,dy),st=r.sp*d2;
    if(dd<=st+2){burst(r.tx,r.ty,'#ff8f63',18);burst(r.tx,r.ty,'#ffe29a',8);shake=Math.max(shake,.55);sfx('boom');rocks.splice(i,1);}
    else{r.x+=dx/dd*st;r.y+=dy/dd*st;}
  }
  if(rocks.length)for(const i of tileList('turret')){
    turCD[i]=(turCD[i]||0)-d2;if(turCD[i]>0)continue;
    const p=tc(i);let best=null,bd=300;
    for(const r of rocks){if(r.d>0)continue;const dd=Math.hypot(r.x-p.x,r.y-p.y);if(dd<bd){bd=dd;best=r;}}
    if(best){beams.push({x1:p.x,y1:p.y,x2:best.x,y2:best.y,life:.18});burst(best.x,best.y,'#ffe29a',10);rocks.splice(rocks.indexOf(best),1);turCD[i]=.7;}
  }

function sigOf(){
  let s=tab+'|';
  if(tab==='build'){
    s+=placing+'|'+S.sel+'|'+demArm+'|';
    for(const t of ORDER)s+=(unlocked(t)?1:0)+''+(can(costOf(t))?1:0)+count(t)+',';
    if(S.sel!=null&&S.grid[S.sel]){const k=S.grid[S.sel];s+=k.t+k.lvl+(can(upCost(k))?1:0);}
  }else if(tab==='tech'){
    s+=S.research.map(e=>e.id).join()+'|'+resSlots()+count('lab')+'|';
    for(const x of TECH)s+=has(x.id)?2:(techOk(x)?(S.rp>=x.cost?1:0):3);
  }else if(tab==='market'){
    s+=S.market.p.toFixed(2)+'|'+(S.ore>=1?1:0)+(S.ore>=10?1:0)+(S.ore>=50?1:0)+'|'+oreCap()+'|'+S.contracts.map(c=>c.id+(S.ore>=c.ore?1:0)).join();
  }else if(tab==='exp'){
    s+=S.exps.length+'|'+(count('lab')?1:0)+(count('analyzer')?1:0)+'|'+(S.sigCD>0?Math.ceil(S.sigCD/5):0);
    for(const d of DEST)s+=(destOk(d)?1:0)+''+(can(d.cost)?1:0);
    for(const a of ART)s+=(S.stock[a.id]||0)+''+(S.found[a.id]?1:0)+(S.analyzed[a.id]?1:0);
  }else if(tab==='npc'){
    s+=Object.keys(S.unlocked).join()+JSON.stringify(S.aff)+JSON.stringify(S.q);
    for(const q of Q)if(S.unlocked[q.npc]&&!S.q[q.id]){const [a,b]=q.g();s+=Math.min(a,b)+',';}
  }else s+=Object.keys(S.ach).length+'|'+blds()+'|'+S.stats.exp+'|'+foundN()+'|'+Math.floor(S.stats.earned/50)+'|'+S.goals.map(g=>Math.floor(Math.max(0,Math.min(GT[g.k].p(g),g.n))/Math.max(1,g.n/20))).join();
  return s;
}

const ACT={
  pick(v){placing=placing===v?null:v;S.sel=null;demArm=-1;refreshPanel(true);},
  desel(){S.sel=null;demArm=-1;refreshPanel(true);},
  upg(){upgrade();refreshPanel(true);},
  dem(){demolish();refreshPanel(true);},
  tech(v){startTech(v);refreshPanel(true);},
  sell(v){
    const have=Math.floor(S.ore),n=v==='all'?have:Math.min(+v,have);if(n<=0)return;
    const g=Math.floor(n*S.market.p);S.ore-=n;addCr(g);S.stats.sold+=g;
    const hq=tileList('hq')[0],p=tc(hq!=null?hq:34);
    floatText(p.x,p.y-30,'+'+f(g),KCOL.cr,'cr');floatText(p.x,p.y-8,'-'+f(n),KCOL.ore,'ore');vaultP=1;sfx('coin');
    toast('광물 '+f(n)+'개를 '+f(g)+' 크레딧에 팔았습니다.','gold');checkAch();updateTop();refreshPanel(true);
  },
  ctr(v){
    const i=S.contracts.findIndex(c=>c.id===v);if(i<0)return;const c=S.contracts[i];
    if(S.ore<c.ore){toast('광물이 부족합니다.','bad');return;}
    S.ore-=c.ore;addCr(c.reward);S.stats.ctr++;S.contracts.splice(i,1);
    const hq=tileList('hq')[0],p=tc(hq!=null?hq:34);floatText(p.x,p.y-30,'+'+f(c.reward),KCOL.cr,'cr');vaultP=1;
    toast('납품 완료. '+f(c.reward)+' 크레딧을 받았습니다.','gold');checkAch();updateTop();refreshPanel(true);
  },
  exp(v){startExp(v);refreshPanel(true);},
  sig(){openMini();},
  gclaim(v){
    const i=+v,g=S.goals[i];if(!g||!goalOK(g))return;
    S.goals.splice(i,1);S.stats.goals++;const txt=giveReward(g.r);genGoal();
    toast('임무 완료 · '+txt,'gold');checkAch();recalc();updateTop();refreshPanel(true);
  },
  ana(v){analyze(v);updateTop();refreshPanel(true);},
  talk(id){
    const n=NPC[id],hi=(S.aff[id]||0)>=2?1:0;let line=pick(CHAT[id][hi]);
    if(id==='bori'&&C.effE<1)line='전력 부족! 공급 '+Math.floor(C.supply)+', 수요 '+Math.ceil(C.demand)+'야. 패널이든 반응로든 늘려!';
    if(id==='nova'&&C.effS<1)line='승무원이 부족해서 시설이 느려지고 있어요. 거주 모듈을 지어 주세요.';
    else if(id==='nova'&&C.effE>=1&&Math.random()<.5)line='현재 목표는 "'+OBJ[Math.min(S.chapter,OBJ.length-1)]+'"입니다.';
    showDialog({title:n.n+'와의 대화',lines:[{who:id,t:line}],choices:[]});
  },
  claim(v){
    const q=Q.find(x=>x.id===v);if(!q||S.q[v])return;const [a,b]=q.g();if(a<b)return;
    S.q[v]=1;S.aff[q.npc]=(S.aff[q.npc]||0)+1;const txt=giveReward(q.r);recalc();updateTop();
    showDialog({title:'의뢰 완료 · '+q.n,lines:[{who:q.npc,t:q.line},{who:'sys',t:'보상: '+txt+' · '+NPC[q.npc].n+' 호감도 상승'}],choices:[]});
    checkAch();refreshPanel(true);
  },
  save(){save(true);},
  reset(v,b){
    if(b.dataset.arm){S=newState();tryRemove();afterLoad(true);return;}
    b.dataset.arm='1';b.textContent='한 번 더 누르면 모두 삭제됩니다';b.classList.add('pri');
    setTimeout(()=>{if(b.isConnected){delete b.dataset.arm;b.textContent='처음부터 다시';b.classList.remove('pri');}},3500);
  }
};

  let claim=false;for(const q of Q){if(S.unlocked[q.npc]&&!S.q[q.id]){const [a,b]=q.g();const first=Q.filter(x=>x.npc===q.npc).find(x=>!S.q[x.id]);if(first===q&&a>=b)claim=true;}}
  $('#npcdot').hidden=!claim;
  $('#mktdot').hidden=!S.contracts.some(c=>S.ore>=c.ore);
  $('#logdot').hidden=!S.goals.some(goalOK);
  updateDyn();
}
function updateHint(){
  const h=$('#hint');
  if(hover>=0){
    const k=S.grid[hover];
    if(k)h.textContent=DEF[k.t].n+' Lv '+k.lvl+' · '+statText(k);
    else if(placing)h.textContent=DEF[placing].n+' 설치 · '+costText(costOf(placing));
    else h.textContent='빈 칸 · 건설 탭에서 시설을 고르세요.';
  }else h.textContent=placing?DEF[placing].n+'을 설치할 칸을 누르세요.':'보급 캡슐이 지나가면 눌러서 회수하세요. 빈 칸에는 새 시설을 지을 수 있습니다.';
}
function toast(t,k){
  if(k==='gold')sfx('chime');else if(k==='bad')sfx('alert');
  const box=$('#toasts');while(box.children.length>3)box.firstChild.remove();
  const d=document.createElement('div');d.className='toast '+(k||'');d.textContent=t;box.appendChild(d);
  setTimeout(()=>d.classList.add('out'),3200);setTimeout(()=>d.remove(),3700);
}

/* ====================== 입력 ====================== */
function pos(e){const r=cv.getBoundingClientRect();return {x:(e.clientX-r.left)*W/r.width,y:(e.clientY-r.top)*H/r.height};}
function tileAt(x,y){const q=Math.floor((x-OX)/T),r=Math.floor((y-OY)/T);return (q<0||r<0||q>=COLS||r>=ROWS)?-1:r*COLS+q;}
cv.addEventListener('pointermove',e=>{const p=pos(e);hover=tileAt(p.x,p.y);updateHint();});
cv.addEventListener('pointerleave',()=>{hover=-1;updateHint();});
cv.addEventListener('pointerdown',e=>{
  if(modalOpen||miniOpen||e.button===2)return;
  const p=pos(e);
  for(let i=caps.length-1;i>=0;i--){if(Math.hypot(p.x-caps[i].x,p.y-caps[i].y)<caps[i].r+16){grabCap(i);return;}}
  for(let i=comets.length-1;i>=0;i--){if(Math.hypot(p.x-comets[i].x,p.y-comets[i].y)<comets[i].r+14){takeComet(comets[i]);return;}}
  const idx=tileAt(p.x,p.y);hover=idx;demArm=-1;
  if(idx<0){if(!placing)S.sel=null;refreshPanel(true);return;}
  if(S.grid[idx]){S.sel=idx;placing=null;setTab('build');return;}
  if(placing)place(idx,placing);else S.sel=null;
  refreshPanel(true);updateHint();
});
cv.addEventListener('contextmenu',e=>{e.preventDefault();placing=null;S.sel=null;refreshPanel(true);});
window.addEventListener('keydown',e=>{
  if(miniOpen){if(e.key==='Escape')closeMini();return;}
  if(modalOpen){
    if(e.key==='Enter'||e.key===' '){
      if(tt){e.preventDefault();skipType();}
      else if(document.activeElement===document.body){const b=$('#m-act button:not(:disabled)');if(b){e.preventDefault();b.click();}}
    }
    return;
  }
  if(e.key==='Escape'){placing=null;S.sel=null;refreshPanel(true);}
  else if(e.key===' '&&document.activeElement===document.body){e.preventDefault();setSpeed(S.speed>0?0:1);}
});

/* ====================== 메인 루프 ====================== */
let last=performance.now(),acc=0;
function frame(now){
  const dt=Math.min(.25,(now-last)/1000);last=now;
  if(!modalOpen&&!miniOpen&&S.speed>0){acc+=dt*S.speed;let n=0;while(acc>=1&&n<8){acc-=1;n++;step();}if(n>=8)acc=0;}
  anim+=dt;updateWorld((modalOpen||miniOpen)?0:dt);drawScene(dt);animNums(dt);
  if(S.research.map(e=>e.id).join()!==rsig)renderRStrip();
  updateLive();
  requestAnimationFrame(frame);
}
const stage=$('.stage'),side=$('.side'),mq=window.matchMedia('(min-width:961px)');
function fitSide(){side.style.height=mq.matches?stage.offsetHeight+'px':'auto';}
if(window.ResizeObserver)new ResizeObserver(fitSide).observe(stage);
if(mq.addEventListener)mq.addEventListener('change',fitSide);

function afterLoad(fresh){
  placing=null;S.sel=null;demArm=-1;dialogQueue=[];modalOpen=false;M.hidden=true;
  caps.length=0;ships.length=0;fx.length=0;flows.length=0;walkers.length=0;drones.length=0;rocks.length=0;beams.length=0;comets.length=0;
  for(const k in born)delete born[k];acc=0;
  recalc();ensureGoals();setSpeed(S.speed||1);setTab('build');renderRStrip();updateTop();snapNums();updateHint();setSound(AU.on);
  if(fresh)toast('새 게임을 시작합니다.');
  if(canInterrupt())checkStory();
}
function boot(data){
  let raw=data&&data.save;
  if(!raw){try{raw=localStorage.getItem(KEY);}catch(e){raw=null;}}
  const s=raw?loadState(raw):null;
  S=s||newState();
  afterLoad(false);fitSide();
  requestAnimationFrame(t=>{last=t;frame(t);});
}
window.addEventListener('beforeunload',()=>save());
document.addEventListener('visibilitychange',()=>{if(document.hidden)save();});
const HOT=window.claude&&window.claude.hot;
if(HOT&&HOT.snapshot)HOT.snapshot(()=>({save:JSON.stringify(S)}));
if(HOT&&HOT.ready)HOT.ready(boot);else boot((HOT&&HOT.data)||{});
})();
</script>

</body></html>
